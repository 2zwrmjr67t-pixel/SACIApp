<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SACI · Protótipo do app do atleta</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#B3171D;--ink:#1d1d1f;--mut:#6b6b70;--line:#e4e2de;--paper:#f4f2ee}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .brand{font-weight:700;color:var(--red);margin-right:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:#fff}
.seg button.on{background:var(--red);color:#fff;border-color:var(--red)}
.bar select{width:auto;padding:6px 8px;font-size:13px}
.bar .sp{flex:1}
.bar .lk{font-size:12px;color:var(--mut);text-decoration:underline;padding:4px}
.fict{background:#fff7d6;color:#6d5a00;font-size:12px;padding:4px 12px;text-align:center}
.stage{display:flex;justify-content:center;padding:18px 8px 40px}
.phone{--bg:#fff;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--ac:#B3171D;--ac2:#ffc93c;--bd:#e4e2de;--soft:#faf6ee;width:100%;max-width:400px;height:780px;max-height:calc(100vh - 110px);min-height:560px;background:var(--bg);color:var(--tx);border-radius:28px;border:8px solid #1d1d1f;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.th-play{--bg:#fff8e8;--soft:#fff;--ac:#B3171D;--ac2:#ffc93c;--bd:#f0e2bf}
.th-sport{--bg:#15181d;--card:#1f242b;--tx:#f1f1f1;--mut:#9aa0a8;--ac:#e0343b;--ac2:#e0343b;--bd:#2c323b;--soft:#1f242b}
.ph-top{padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.ph-top b{color:var(--ac)}
.ph-body{flex:1;overflow-y:auto;padding:6px 14px 16px}
.tabs{display:flex;border-top:1px solid var(--bd);background:var(--card)}
.tabs button{flex:1;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button.on{color:var(--ac);font-weight:700}
.dot{position:absolute;top:4px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.hero{display:flex;gap:12px;align-items:center;margin:8px 0}
.hero .nm{font-size:20px;font-weight:700}
.sub{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--bd)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center}
.tile b{display:block;font-size:20px;color:var(--ac)}
.tile small{font-size:10.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.card h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:6px;font-weight:600}
.card .big{font-weight:600}
.wk{display:flex;gap:6px;margin:6px 0}
.wk i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd)}
.wk i.f{background:var(--ac);border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px}
.btn.s{padding:6px 10px;font-size:13px}
.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn.g{background:#e9e7e2;color:var(--ink)}
.note{display:flex;gap:8px;align-items:center;background:var(--ac2);color:#1d1d1f;padding:9px 10px;border-radius:12px;margin:8px 0;font-size:13px}
.note span{flex:1}
.note button{font-weight:700;font-size:13px}
.th-sport .note{background:#2a2f38;color:var(--tx);border:1px solid var(--bd)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.ptabs button{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--bd);font-size:13px;background:var(--card)}
.ptabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cd{border-radius:14px;padding:12px 8px;text-align:center;border:1.5px solid var(--bd);min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--card)}
.cd.on{border-color:var(--ac);background:linear-gradient(160deg,var(--card),var(--soft));box-shadow:0 2px 8px rgba(179,23,29,.18)}
.cd .em{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff}
.cd.off .em{background:transparent;border:1.5px dashed var(--bd);color:var(--mut)}
.cd b{font-size:13px}
.cd small{font-size:11px;color:var(--mut)}
.cd.off{opacity:.75}
.ph h3{font-size:14px;margin:14px 0 6px;color:var(--mut)}
.path{display:flex;flex-direction:column;gap:8px}
.node{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:10px}
.node i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ddd;color:#fff;flex:none}
.node b{font-size:14px;display:block}
.node small{color:var(--mut);font-size:12px}
.node.done i{background:#2e8b57}
.node.cur{border-color:var(--ac)}
.node.cur i{background:var(--ac)}
.node.fut{opacity:.55}
.crs{display:flex;flex-direction:column;gap:8px}
.crs .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;color:var(--ac)}
.bar2{height:6px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar2 i{display:block;height:100%;background:var(--ac)}
.ev{display:flex;gap:10px;align-items:flex-start}
.ev .dt{min-width:46px;text-align:center;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:4px}
.ev .dt b{display:block;font-size:17px;color:var(--ac)}
.ev .dt small{font-size:10px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--bd);color:var(--mut);margin-right:4px}
.tag.r{background:#fde4e4;color:#8b1218;border-color:#f5bcbc}
.tag.g{background:#e1f3e8;color:#1f6b40;border-color:#b8e0c8}
.tag.y{background:#fff3c9;color:#6d5a00;border-color:#ecd98a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:var(--bg,#fff);color:var(--tx,var(--ink));width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border-radius:18px;padding:16px;--card:#fff;--bd:#e4e2de;--soft:#faf6ee;--ac:#B3171D;--mut:#6b6b70;--tx:#1d1d1f;--bg:#fff}
.modal h3{margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;padding:11px;margin:6px 0;border:1.5px solid var(--bd);border-radius:12px;background:var(--card)}
.opt.ok{border-color:#2e8b57;background:#e1f3e8}
.opt.no{border-color:#c78a1c;background:#fff3c9}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.web{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr;gap:12px}
.side{display:flex;gap:6px;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.side button{white-space:nowrap;padding:8px 12px;border-radius:8px;font-size:14px;display:flex;gap:6px;align-items:center}
.side button.on{background:var(--red);color:#fff}
.main{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
@media(min-width:860px){.web{grid-template-columns:200px 1fr}.side{flex-direction:column;align-self:start}}
.main h2{font-size:18px;margin-bottom:10px}
.main h3{font-size:15px;margin:16px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper)}
.kpi b{font-size:24px;color:var(--red);display:block}
.kpi small{color:var(--mut)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:8px 0}
.fr label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.main .btn{background:var(--red)}
.main .btn.o{background:transparent;color:var(--red);border-color:var(--red)}
.main .btn.g{background:#e9e7e2;color:var(--ink)}
.sig{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.sig input[type=checkbox]{width:auto;margin-top:3px}
.sig .ev2{flex:1}
.sig .ev2 input[type=text]{margin-top:5px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
.panel.w{background:#fff7d6;border-color:#ecd98a}
.mut{color:var(--mut);font-size:13px}
.ck{display:flex;gap:6px;align-items:center;margin:4px 0}
.ck input{width:auto}
.av{display:inline-block;vertical-align:middle}
.sm{font-size:12px}
.hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.phone select,.phone input{background:var(--card);color:var(--tx);border-color:var(--bd)}
/* ===== v2: vermelho, branco e cinza + dinamismo ===== */
:root{--red:#C4161C;--red2:#8E0F14;--g1:#f4f4f5;--g2:#e2e2e5;--g3:#8a8d93;--g4:#3a3c41}
body{background:var(--g1)}
.bar{background:var(--red);border:0;color:#fff;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px)}
.bar .brand{color:#fff;letter-spacing:.08em}
.bar .mut{color:#ffe1e1}
.seg button{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.seg button.on{background:#fff;color:var(--red);border-color:#fff}
.bar select{background:#fff;color:var(--ink);border:0}
.bar .lk{color:#fff}
.fict{background:#fff;color:var(--g3);border-bottom:1px solid var(--g2)}
.phone{border-color:#26282c}
.th-play{--bg:#f5f5f6;--card:#fff;--soft:#fff;--tx:#1d1d1f;--mut:#74777d;--ac:#C4161C;--ac2:#C4161C;--bd:#e3e3e6}
.th-sport{--bg:#26282c;--card:#313338;--tx:#f2f2f2;--mut:#a3a6ab;--ac:#e2353c;--ac2:#e2353c;--bd:#3d4046;--soft:#2d2f34}
.ph-top{background:var(--ac);color:#fff;padding:10px 16px}
.ph-top b{color:#fff;letter-spacing:.06em}
.ph-body{padding-top:0}
.anim .ph-body>*{animation:rise .38s both}
.anim .ph-body>*:nth-child(2){animation-delay:.04s}.anim .ph-body>*:nth-child(3){animation-delay:.08s}.anim .ph-body>*:nth-child(4){animation-delay:.12s}.anim .ph-body>*:nth-child(5){animation-delay:.16s}.anim .ph-body>*:nth-child(6){animation-delay:.2s}.anim .ph-body>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs button{transition:color .2s}
.tabs button.on::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ac);animation:grow .25s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.tabs button.on svg{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.dot{background:var(--ac);box-shadow:0 0 0 0 rgba(196,22,28,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(196,22,28,0)}}
/* hero */
.hero2{margin:0 -14px 10px;padding:16px 16px 18px;background:var(--ac);color:#fff;position:relative;overflow:hidden;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 16px,transparent 16px 32px)}
.hero2 .stad{position:absolute;right:-20px;bottom:-6px;width:260px;opacity:.22}
.hero2 .hrow{display:flex;gap:12px;align-items:center;position:relative}
.hero2 .av{border-radius:50%;box-shadow:0 0 0 3px #fff}
.hero2 .nm{font-size:21px;font-weight:800;line-height:1.1}
.hero2 .hsub{opacity:.9;font-size:13px}
.th-sport .hero2{background-color:#1d1e21;border-bottom:3px solid var(--ac)}
.hero2.sel{background-color:var(--red2)}
.hero2.sel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);animation:sheen 3.2s infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.selb{display:inline-block;margin-top:6px;background:#fff;color:var(--red);font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.chips span{background:var(--card)}
.tile{position:relative;overflow:hidden}
.tile svg{color:var(--ac);opacity:.9}
.anim .tile b{animation:pop .5s .2s both}
.card{position:relative}
.card.hl{border-color:var(--ac);border-width:1.5px}
.card.hl::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.note,.th-sport .note{background:var(--card);color:var(--tx);border:1.5px solid var(--ac)}
.note svg{color:var(--ac);animation:pop .6s 2}
.anim .wk i.f{animation:pop .4s both}
/* cards colecionáveis */
.cc{border-radius:14px;overflow:hidden;background:var(--card);border:1.5px solid var(--bd);text-align:center;display:flex;flex-direction:column;min-height:150px;transition:transform .2s}
.cc .ct{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;background:var(--g2);color:var(--g3)}
.cc .ce{margin:12px auto 6px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--bd);color:var(--mut)}
.cc b{font-size:13px;padding:0 8px}
.cc small{font-size:11px;color:var(--mut);padding:2px 8px 10px}
.cc.on{border-color:var(--ac);box-shadow:0 4px 14px rgba(196,22,28,.18)}
.cc.on .ct{background:var(--ac);color:#fff;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.cc.on .ce{background:var(--ac);border:3px solid #fff;color:#fff;box-shadow:0 0 0 2px var(--ac)}
.cc.on:hover{transform:translateY(-3px) rotate(-1deg)}
.cc.off{opacity:.7}
.cc.sel{border-color:var(--red2)}
.cc.sel .ct{background-color:var(--red2)}
.cc.sel .ce{background:var(--red2)}
.prog{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin:2px 0 10px}
.prog i{display:block;height:100%;background:var(--ac);transform-origin:left}.anim .prog i{animation:fill .8s both}
@keyframes fill{from{transform:scaleX(0)}}
/* trilha em zigue-zague */
.phz{margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.phz b{background:var(--ac);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.phz span{font-weight:700}
.zig{position:relative;padding:6px 0}
.zig::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--bd)}
.zn{position:relative;display:flex;align-items:center;gap:10px;margin:10px 0;width:62%}
.zn.p0{margin-left:0}.zn.p1{margin-left:19%}.zn.p2{margin-left:38%}
.zn .orb{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--g2);color:#fff;border:4px solid var(--bg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.zn.done .orb{background:var(--ac)}
.zn.cur .orb{background:#fff;color:var(--ac);border-color:var(--ac);animation:pulse 1.4s infinite}
.th-sport .zn.cur .orb{background:var(--card)}
.zn.fut .orb{background:var(--g3);opacity:.5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,22,28,.5)}70%{box-shadow:0 0 0 12px rgba(196,22,28,0)}100%{box-shadow:0 0 0 0 rgba(196,22,28,0)}}
.zn .lb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 9px;font-size:13px;line-height:1.25}
.zn .lb small{display:block;color:var(--mut);font-size:11px}
.zn.fut .lb{opacity:.6}
.zn button.orb:disabled{opacity:1;cursor:default}
.zn.fut button.orb:disabled{opacity:.5}
/* revelação de card */
.reveal{text-align:center;position:relative;overflow:hidden;padding-top:8px}
.reveal h3{font-size:22px;color:var(--ac);margin-top:12px}
.flip{perspective:800px;width:190px;margin:0 auto}
.flip .cc{min-height:240px;animation:flipin .9s cubic-bezier(.2,.8,.3,1.2) both}
.flip .cc .ce{width:84px;height:84px;margin-top:28px}
.flip .cc b{font-size:17px;margin-top:8px}
@keyframes flipin{0%{transform:rotateY(180deg) scale(.5);opacity:0}60%{transform:rotateY(-12deg) scale(1.06);opacity:1}100%{transform:none}}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in both}
@keyframes fall{to{transform:translateY(440px) rotate(540deg);opacity:0}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:70}
.burst i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall2 1.6s ease-in both}
@keyframes fall2{to{transform:translateY(100vh) rotate(600deg);opacity:0}}
.toast{animation:tin .3s both;background:var(--red)}
@keyframes tin{from{opacity:0;transform:translate(-50%,16px)}}
.opt{transition:transform .15s}.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--red);background:#fdeaea;animation:pop .35s}
.opt.no{border-color:var(--g3);background:var(--g1)}
/* tags e painéis só em vermelho/cinza */
.tag.g{background:#fdeaea;color:var(--red2);border-color:#f3b9bb}
.tag.y{background:var(--g1);color:var(--g4);border-color:var(--g2)}
.tag.r{background:var(--red);color:#fff;border-color:var(--red)}
.panel.w{background:#fdeaea;border-color:#f3b9bb}
.price{color:var(--ac)}
/* web */
.side{border:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.main{border:0;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:4px solid var(--red)}
.anim .main>*{animation:rise .3s both}
.kpi{background:#fff;border:1px solid var(--g2);border-left:4px solid var(--red)}
.anim .kpi b{animation:pop .5s both}
.chip{display:inline-block;margin:4px 6px 4px 0;padding:9px 13px;border-radius:999px;border:1.5px solid var(--g2);background:#fff;font-size:14px;transition:all .15s}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.03)}
.chip.ctx.on{background:var(--g4);border-color:var(--g4)}
.cnt{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin-left:6px}

/* ===== v3: experiência do atleta em primeiro plano ===== */
.bar{position:static;background:none;background-image:none;color:var(--ink);padding:0;border:0;flex-direction:column;align-items:stretch}
.bar .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bar .seg button{color:var(--ink);border-color:var(--g2);background:#fff;padding:9px}
.bar .seg button.on{background:var(--red);color:#fff;border-color:var(--red)}
.bar select{border:1px solid var(--g2);width:100%}
.bar .lk{color:var(--g3);text-align:left}
.demo{position:fixed;left:10px;bottom:10px;z-index:40;width:34px;height:34px;border-radius:50%;background:rgba(40,42,46,.35);color:#fff;display:grid;place-items:center;opacity:.55;transition:opacity .2s}

ACT.valid=d=>{const r=S.reqs.find(x=>x.id===d.id),a=A(r.aid);r.status='ok';if(d.v==='1'){if(!a.done.includes(r.nid))a.done.push(r.nid);award(a.id,r.card);a.stats.missoes++;log(T(V.cid).name,'Validou desafio ('+a.name+')');toast('Desafio validado: card entregue')}else{S.notifs.push({id:uid(),aid:a.id,aud:'atleta',text:'Quase lá! Continue treinando esse desafio e peça de novo quando quiser.',seen:false});toast('Registrado: o atleta pode tentar de novo')}};
function tDest(c){
 if(!c.modulo)return `<h2>Indicar atleta</h2><div class="panel w">Este recurso é liberado depois do módulo <b>Leitura de jogo: básico</b> (gratuito).<p style="margin-top:8px"><button class="btn" data-act="tab" data-r="trn" data-v="crs">Ir para Cursos</button></p></div>`;
 const as=myAth();if(V.form.sent)return `<h2>Indicar atleta</h2><div class="panel">Indicação enviada ao SACI. Você não acompanha o status depois do envio: é assim por desenho.</div><button class="btn" data-act="newdest">Nova indicação</button>`;
 const sel=V.form.dAth;
 if(!sel)return `<h2>Indicar atleta</h2><p class="mut">Disponível para Sub-11 e Sub-13. Escolha o atleta:</p><div class="tw"><table>${as.map(a=>{const el=a.cat==='Sub-11'||a.cat==='Sub-13';return `<tr><td>${avatar(a,30)} ${esc(a.name)}</td><td>${a.cat}</td><td><button class="btn s" ${el?'':'disabled'} data-act="dpick" data-a="${a.id}">Indicar</button>${el?'':' <span class="mut sm">só Sub-11 e Sub-13</span>'}</td></tr>`}).join('')}</table></div>`;
 const a=A(sel);if(!a.consent.sinais||a.consent.pendUpd)return `<h2>Indicar atleta</h2><div class="panel w">Há pendência de consentimento para ${esc(a.name)}. Fale com a família antes de registrar.</div><button class="btn g" data-act="newdest">Voltar</button>`;
 const nsel=SIGNALS.filter(s=>V.form['s_'+s.id]).length;return `<h2>Indicar: ${esc(a.name)} <span class="tag">${a.cat}</span></h2><p class="mut">Toque no que você viu. Sem nota, sem texto: o SACI confirma no próximo evento.</p>${['Jogo','Aprendizagem','Atitude'].map(g=>`<h3>${g}</h3><div>${SIGNALS.filter(s=>s.g===g).map(s=>`<button class="chip ${V.form['s_'+s.id]?'on':''}" data-act="sigt" data-k="s_${s.id}">${esc(s.t)}</button>`).join('')}</div>`).join('')}<h3>Contexto (opcional)</h3><button class="chip ctx ${V.form.mat?'on':''}" data-act="sigt" data-k="mat">Parece amadurecer mais tarde que os colegas</button><p style="margin-top:14px"><button class="btn" data-act="dsend">Indicar ao SACI${nsel?`<span class="cnt" style="background:#fff;color:var(--red)">${nsel}</span>`:''}</button> <button class="btn g" data-act="newdest">Cancelar</button></p>`}
ACT.sigt=d=>{V.form[d.k]=!V.form[d.k];render()};
ACT.dpick=d=>{V.form={dAth:d.a};render()};ACT.newdest=()=>{V.form={};render()};
ACT.dsend=()=>{const a=A(V.form.dAth),c=T(V.cid),obs={};SIGNALS.forEach(s=>{if(V.form['s_'+s.id])obs[s.id]={ev:(V.form['e_'+s.id]||'').trim()}});const ks=Object.keys(obs);
 if(!ks.length){toast('Toque em ao menos um item');return}if(V.form.mat)a.mat='tardia';
 S.signals.push({id:uid(),aid:a.id,tr:c.id,d:TODAY,obs,conf:{}});if(!S.funil[a.id])S.funil[a.id]={status:'Sinalizado',rev:'2027-05-05'};log(c.name,'Indicou atleta ('+a.name+')');V.form={sent:1};render()};
function tCrs(c){const key='c:'+c.id;return `<h2>Cursos para treinadores</h2><div class="crs">${COURSES.filter(x=>x.aud==='treinador').map(x=>{const h=hasKey(key,x.id),dn=h?h.les.length:0;const btn=h?(dn>=x.les.length?'<span class="tag g">Concluído</span>':`<button class="btn s" data-act="copen" data-c="${x.id}" data-k="${key}">Continuar</button>`):`<button class="btn s" data-act="ctbuy" data-c="${x.id}">${x.price?'Adquirir ('+brl(x.price)+')':'Começar'}</button>`;return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.t)}</b><div class="mut">${esc(x.d)}</div></div><span class="price" style="color:var(--red);font-weight:700">${brl(x.price)}</span></div><div style="margin-top:8px">${btn}</div></div>`}).join('')}</div><p class="mut">Compra simulada: pagamento real fica para a startup.</p>`}
ACT.ctbuy=d=>{const key='c:'+V.cid;grant(key,d.c);V.modal={k:'course',cid:d.c,key};render()};
function tProj(c){const p=P(c.partner),as=S.athletes.filter(a=>a.partner===p.id),pend=as.filter(a=>!(a.consent.termo==='v1.1'&&!a.consent.pendUpd)).length;
 const n=S.signals.filter(s=>as.some(a=>a.id===s.aid)).length;
 return `<h2>Meu projeto: ${esc(p.name)}</h2><div class="kpis"><div class="kpi"><b>${as.length}</b><small>Atletas</small></div><div class="kpi"><b>${S.coaches.filter(x=>x.partner===p.id).length}</b><small>Treinadores</small></div><div class="kpi"><b>${pend}</b><small>Pendências de consentimento</small></div><div class="kpi"><b>${n}</b><small>Registros enviados ao SACI (só contagem)</small></div></div><h3>Treinadores</h3><table>${S.coaches.filter(x=>x.partner===p.id).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.modulo?'<span class="tag g">Leitura de jogo concluída</span>':'<span class="tag y">Módulo pendente</span>'}</td></tr>`).join('')}</table><h3>Próximos eventos</h3>${S.events.filter(e=>e.d>=TODAY&&(e.partner===p.id||(e.partners||[]).includes(p.id)||e.kind==='macro')).map(e=>`<div>${fd(e.d)} · ${esc(e.t)}</div>`).join('')}<div class="panel">O dono vê contagens e pendências, nunca o status individual do funil.</div>`}
/* ---------- SACI ---------- */
function webSaci(){const t=V.tab.saci,tabs=[['painel','Painel'],['parc','Parceiros'],['atl','Atletas'],['ev','Eventos'],['funil','Funil'],['conv','Convocatórias']];
 const fn={painel:sPainel,parc:sParc,atl:sAtl,ev:sEv,funil:sFunil,conv:sConv}[t];
 return `<div class="web"><div class="side">${tabs.map(x=>`<button class="${t===x[0]?'on':''}" data-act="tab" data-r="saci" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div class="main">${fn()}</div></div>`}
function sPainel(){const fun=Object.keys(S.funil);const rq=S.reqs.filter(r=>(r.kind==='acesso'||r.kind==='exclusao')&&r.status==='pend');const unc=S.signals.filter(s=>Object.keys(s.obs).some(k=>!s.conf[k]));
 const pc=S.athletes.filter(a=>!(a.consent.termo==='v1.1'&&!a.consent.pendUpd)).length;
 return `<h2>Painel</h2><div class="kpis"><div class="kpi"><b>${S.athletes.length}</b><small>Atletas ativos</small></div><div class="kpi"><b>${S.partners.length}</b><small>Parceiros</small></div><div class="kpi"><b>${fun.length}</b><small>No funil</small></div><div class="kpi"><b>${fun.filter(k=>S.funil[k].status==='Convocado à Seleção').length}</b><small>Convocados</small></div><div class="kpi"><b>${pc}</b><small>Pendências de consentimento</small></div><div class="kpi"><b>${S.counts.archived}</b><small>Arquivados (só contagem)</small></div></div>
 <h3>Pendências</h3>${rq.map(r=>`<div class="panel">${r.kind==='acesso'?'Cópia dos dados':'Exclusão de dados'} · ${esc(A(r.aid).name)} (pedido do responsável) <button class="btn s" data-act="atend" data-id="${r.id}">Marcar como atendida</button></div>`).join('')}${unc.length?`<div class="panel">${unc.length} sinalização(ões) aguardando confirmação no próximo evento. <button class="btn s o" data-act="tab" data-r="saci" data-v="funil">Abrir funil</button></div>`:''}${S.reqs.filter(r=>r.kind==='conv'&&r.status==='pend').map(r=>`<div class="panel">Convocação de ${esc(A(r.aid).name)} aguardando liberação do responsável.</div>`).join('')}${!rq.length&&!unc.length?'<p class="mut">Sem pendências.</p>':''}
 <h3>Próximas oportunidades com parceiros</h3><table>${S.partners.slice().sort((x,y)=>x.proxD.localeCompare(y.proxD)).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.prox)}</td><td>${fd(p.proxD)}</td></tr>`).join('')}</table>
 <h3>Auditoria recente</h3>${S.audit.slice(0,6).map(x=>`<div class="mut">${fd(x.d)} · ${esc(x.who)}: ${esc(x.t)}</div>`).join('')}`}
ACT.atend=d=>{const r=S.reqs.find(x=>x.id===d.id);r.status='ok';S.notifs.push({id:uid(),aid:r.aid,aud:'resp',text:(r.kind==='acesso'?'Sua cópia dos dados está pronta (simulado).':'Seu pedido de exclusão foi atendido (simulado).'),seen:false});log('SACI','Atendeu pedido do responsável ('+A(r.aid).name+')');toast('Pedido atendido')};
function sParc(){const sel=V.form.pSel&&P(V.form.pSel);if(!sel)return `<h2>Parceiros</h2><div class="tw"><table><tr><th>Parceiro</th><th>Cidade</th><th>Modalidade</th><th>Faixa</th><th>Último contato</th><th></th></tr>${S.partners.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.city)}</td><td>${p.mod}</td><td>${p.faixa}</td><td>${fd(p.ult)}</td><td><button class="btn s o" data-act="psel" data-id="${p.id}">Abrir</button></td></tr>`).join('')}</table></div>`;
 const p=sel;return `<button class="btn g s" data-act="psel" data-id="">← Voltar</button><h2 style="margin-top:8px">${esc(p.name)}</h2><div class="fr"><div><label>Cidade / região</label>${esc(p.city)} / ${esc(p.reg)}</div><div><label>Modalidade</label>${p.mod}</div><div><label>Faixa etária</label>${p.faixa}</div><div><label>Atletas (porte)</label>${p.porte}</div><div><label>Estrutura</label>${esc(p.estr)}</div><div><label>Perfil</label>${esc(p.perfil)}</div><div><label>Forma de relação</label>${esc(p.forma)}</div><div><label>Contato</label>${esc(p.contato)}</div></div><div class="panel"><b>Comportamento:</b> ${esc(p.comp)}<br><b>Capacidade:</b> ${esc(p.cap)}</div>
 <h3>Treinadores e atletas</h3><div>${S.coaches.filter(c=>c.partner===p.id).map(c=>esc(c.name)).join(', ')} · ${S.athletes.filter(a=>a.partner===p.id).map(a=>esc(a.name)+' ('+a.cat+')').join(', ')}</div>
 <h3>Próxima oportunidade</h3><div class="fr"><div><input data-f="pProx" value="${esc(V.form.pProx!=null?V.form.pProx:p.prox)}"></div><div><input type="date" data-f="pProxD" value="${V.form.pProxD||p.proxD}"></div></div><button class="btn s" data-act="psaveprox" data-id="${p.id}">Salvar</button>
 <h3>Histórico</h3>${p.hist.map(h=>`<div class="mut">${fd(h.d)} · <b>${h.tipo}</b>: ${esc(h.n)}</div>`).join('')}<div class="fr"><div><select data-f="hTipo"><option>Visita</option><option>Contato</option><option>Evento</option></select></div><div><input data-f="hNota" placeholder="Anotação"></div></div><button class="btn s" data-act="hadd" data-id="${p.id}">Adicionar registro</button>`}
ACT.psel=d=>{V.form=d.id?{pSel:d.id}:{};render()};
ACT.psaveprox=d=>{const p=P(d.id);if(V.form.pProx!=null)p.prox=V.form.pProx;if(V.form.pProxD)p.proxD=V.form.pProxD;log('SACI','Atualizou próxima oportunidade ('+p.name+')');toast('Salvo')};
ACT.hadd=d=>{const p=P(d.id);if(!(V.form.hNota||'').trim()){toast('Escreva a anotação');return}p.hist.unshift({d:TODAY,tipo:V.form.hTipo||'Visita',n:V.form.hNota.trim()});p.ult=TODAY;V.form.hNota='';log('SACI','Registro em '+p.name);toast('Registro adicionado')};
function sAtl(){return `<h2>Atletas ativos</h2><div class="tw"><table><tr><th>Atleta</th><th>Parceiro</th><th>Cat.</th><th>Mod.</th><th>Treinos</th><th>Altura (último)</th><th>Maturação</th><th>Consent.</th></tr>${S.athletes.map(a=>{const h=a.altura.slice(-1)[0];return `<tr><td>${esc(a.name)}</td><td>${esc(P(a.partner).name)}</td><td>${a.cat}</td><td>${a.mod}</td><td>${a.stats.treinos}</td><td>${h?h.cm+' cm ('+fd(h.d)+')':'—'}</td><td>${MATUR.find(m=>m.v===a.mat).t}</td><td>${a.consent.pendUpd?'<span class="tag y">termo v1.2 pendente</span>':'<span class="tag g">ok</span>'}</td></tr>`}).join('')}</table></div>`}
function sEv(){return `<h2>Eventos</h2>${S.events.filter(e=>e.kind==='macro'||e.kind==='comp').sort((x,y)=>x.d.localeCompare(y.d)).map(e=>{const vou=S.athletes.filter(a=>S.rsvp[e.id+a.id]==='vou');return `<div class="panel"><b>${esc(e.t)}</b> · ${fd(e.d)} ${e.h} · ${esc(e.pl)} <span class="tag">${e.kind==='macro'?'Macro '+e.cats.join(', '):'Competição'}</span>${e.card?'<span class="tag y">Card: '+CARDS[e.card].t+'</span>':''}<div class="mut">Confirmados: ${vou.length?vou.map(a=>esc(a.name)).join(', '):'ninguém ainda'}</div>${e.card&&!e.closed?`<p style="margin-top:6px"><button class="btn s" data-act="close_ev" data-id="${e.id}">Encerrar e entregar card aos confirmados</button></p>`:''}${e.closed?'<div class="tag g">Encerrado</div>':''}</div>`}).join('')}
 <h3>Novo evento macro</h3><div class="fr"><div><label>Título</label><input data-f="evT" value="${esc(V.form.evT||'')}"></div><div><label>Data</label><input type="date" data-f="evD" value="${V.form.evD||''}"></div><div><label>Hora</label><input data-f="evH" placeholder="14:00" value="${esc(V.form.evH||'')}"></div><div><label>Local</label><input data-f="evP" value="${esc(V.form.evP||'')}"></div></div><div>${CATS.map(c=>`<label class="ck" style="display:inline-flex;margin-right:10px"><input type="checkbox" data-f="evC_${c}" ${V.form['evC_'+c]?'checked':''}> ${c}</label>`).join('')}</div><div class="fr"><div><label>Card do evento (opcional)</label><select data-f="evK"><option value="">Nenhum</option>${Object.keys(CARDS).filter(k=>CARDS[k].p==='comp'||CARDS[k].p==='marc').map(k=>`<option value="${k}" ${V.form.evK===k?'selected':''}>${CARDS[k].t}</option>`).join('')}</select></div></div><button class="btn" data-act="evnew">Publicar na agenda</button>`}
ACT.evnew=()=>{const f=V.form,cats=CATS.filter(c=>f['evC_'+c]);if(!(f.evT||'').trim()||!f.evD||!cats.length){toast('Informe título, data e ao menos uma categoria');return}S.events.push({id:uid(),kind:'macro',t:f.evT.trim(),d:f.evD,h:f.evH||'09:00',pl:f.evP||'A definir',cats,card:f.evK||null,closed:false});log('SACI','Criou evento macro: '+f.evT.trim());V.form={};toast('Evento publicado: aparece na agenda dos atletas')};
ACT.close_ev=d=>{const e=S.events.find(x=>x.id===d.id);let n=0;S.athletes.forEach(a=>{if(S.rsvp[e.id+a.id]==='vou'){a.stats.eventos++;if(award(a.id,e.card))n++}});e.closed=true;log('SACI','Encerrou evento: '+e.t+' ('+n+' cards)');toast(n+' card(s) entregue(s)')};
function crit(s){const ks=Object.keys(s.obs).filter(k=>s.conf[k]);const j=ks.filter(k=>k[0]==='J').length,at=ks.filter(k=>k[0]!=='J').length;return {j,at,ok:j>=2&&at>=1}}
function sFunil(){const ids=Object.keys(S.funil);if(!ids.length)return '<h2>Funil</h2><p class="mut">Vazio.</p>';
 return `<h2>Funil de atletas de interesse</h2><div class="panel">Visível só para SACI e formação. O treinador só registra; o atleta e a família não veem o status.</div>`+ids.map(id=>{const a=A(id),f=S.funil[id],sg=S.signals.filter(s=>s.aid===id);
  return `<div class="panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b>${esc(a.name)}</b> · ${a.cat} · ${esc(P(a.partner).name)}${a.mat==='tardia'?' <span class="tag r">Maturação tardia indicada: ler o físico com cautela</span>':a.mat==='obs'?' <span class="tag y">Maturação a observar</span>':''}</div><div><select data-chg="fstat" data-a="${id}">${FUNIL.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
  ${sg.map(s=>{const c=crit(s);return `<div style="margin-top:8px"><div class="mut">Indicação de ${fd(s.d)} por ${esc(T(s.tr).name)} · confirmados: ${c.j} de jogo, ${c.at} de aprend./atitude <span class="tag ${c.ok?'g':''}">${c.ok?'critério mínimo atingido [Inferência]':'em formação'}</span></div>${Object.keys(s.obs).map(k=>`<div class="sig"><div class="ev2"><b>${k}</b> ${esc(SIGNALS.find(x=>x.id===k).t)}</div>${s.conf[k]?`<span class="tag g">Confirmado ${fd(s.conf[k])}</span>`:`<button class="btn s" data-act="conf" data-s="${s.id}" data-k="${k}">Confirmar no evento</button>`}</div>`).join('')}</div>`}).join('')}
  <p style="margin-top:8px"><button class="btn s o" data-act="arch" data-a="${id}">Arquivar e apagar dados individuais</button></p></div>`}).join('')}
ACT.fstat=(d,el)=>{S.funil[d.a].status=el.value;log('SACI','Funil: '+A(d.a).name+' → '+el.value);toast('Status atualizado')};
ACT.conf=d=>{const s=S.signals.find(x=>x.id===d.s);s.conf[d.k]=TODAY;log('SACI','Confirmou sinal '+d.k+' ('+A(s.aid).name+')');render()};
ACT.arch=d=>{const a=A(d.a);S.signals=S.signals.filter(s=>s.aid!==d.a);delete S.funil[d.a];S.counts.archived++;log('SACI','Arquivou e apagou dados individuais do funil ('+a.name+')');toast('Arquivado: dados individuais apagados, contagem mantida')};
function sConv(){const cs=S.reqs.filter(r=>r.kind==='conv');return `<h2>Convocatórias</h2><p class="mut">Fluxo: SACI emite → responsável é avisado → responsável libera → card aparece no álbum do atleta.</p>${cs.map(r=>`<div class="panel">${esc(A(r.aid).name)} · ${esc(r.title)} · ${fd(r.date)} <span class="tag ${r.status==='ok'?'g':'y'}">${r.status==='ok'?'Liberada':'Aguardando responsável'}</span></div>`).join('')||''}
 <div class="panel"><b>Já emitida:</b> Gabriel Souza · Rodada Colorada Sub-13 · 05/12/2026 <span class="tag g">Liberada</span></div>
 <h3>Nova convocatória</h3><div class="fr"><div><label>Atleta</label><select data-f="cvA">${S.athletes.map(a=>`<option value="${a.id}" ${V.form.cvA===a.id?'selected':''}>${esc(a.name)} (${a.cat})</option>`).join('')}</select></div><div><label>Título</label><input data-f="cvT" value="${esc(V.form.cvT||'')}" placeholder="Rodada Colorada Sub-11"></div><div><label>Data</label><input type="date" data-f="cvD" value="${V.form.cvD||''}"></div></div><button class="btn" data-act="cvnew">Emitir convocatória</button>`}
ACT.cvnew=()=>{const f=V.form,aid=f.cvA||S.athletes[0].id,a=A(aid);if(!(f.cvT||'').trim()||!f.cvD){toast('Informe título e data');return}
 const eid=uid();S.events.push({id:eid,kind:'conv',t:f.cvT.trim(),d:f.cvD,h:'09:00',pl:'Centro de treinamento',who:[aid],rel:false});S.reqs.push({id:uid(),kind:'conv',aid,eid,title:f.cvT.trim(),date:f.cvD,status:'pend'});S.notifs.push({id:uid(),aid,aud:'resp',text:'Comunicado do Inter sobre '+a.name.split(' ')[0]+': há uma convocação aguardando sua liberação (aba Aprovar).',seen:false});log('SACI','Emitiu convocação: '+f.cvT.trim()+' ('+a.name+')');V.form={};toast('Convocatória emitida: responsável avisado')};
render();
</script></body></html>
